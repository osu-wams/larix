# Breakpoints for Larix theme
# These align with Bootstrap 5 responsive breakpoints
# Note: Remove the xxl breakpoint if using Bootstrap 4

larix.xs:
  label: Extra small
  mediaQuery: '(min-width: 0px)'
  weight: 0
  multipliers:
    - 1x

larix.sm:
  label: Small
  mediaQuery: '(min-width: 576px)'
  weight: 1
  multipliers:
    - 1x

larix.md:
  label: Medium
  mediaQuery: '(min-width: 768px)'
  weight: 2
  multipliers:
    - 1x

larix.lg:
  label: Large
  mediaQuery: '(min-width: 992px)'
  weight: 3
  multipliers:
    - 1x

larix.xl:
  label: Extra large
  mediaQuery: '(min-width: 1200px)'
  weight: 4
  multipliers:
    - 1x

larix.xxl:
  label: Extra extra large
  mediaQuery: '(min-width: 1400px)'
  weight: 5
  multipliers:
    - 1x
